[project]
name = "drok"
version = "0.1.0"
description = "Self-hosted, always-on team of AI agents with a shared computer, Telegram and a web UI. Bring any LLM provider."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Dominykas" }]
keywords = ["ai", "agents", "multi-agent", "self-hosted", "telegram", "llm", "computer-use"]
dependencies = [
    "anthropic>=1.13.0",
    "croniter>=6.2.4",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "mcp>=2.3.0",
    "openai>=3.28.0",
    "playwright>=1.63.0",
    "python-multipart>=0.0.32",
    "python-telegram-bot>=22.8",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/Krumas21/Drok-Bot-Grok-bot-open-source-"
Issues = "https://github.com/Krumas21/Drok-Bot-Grok-bot-open-source-/issues"

[project.scripts]
drok = "drok.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drok"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "ASYNC109"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
