name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Drok version or commit
  - type: input
    id: setup
    attributes:
      label: Host OS / architecture, and models used
      placeholder: "Ubuntu 24.04 amd64, anthropic/claude-sonnet-5-5"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs drok --tail 200` - remove anything secret first."
      render: text
