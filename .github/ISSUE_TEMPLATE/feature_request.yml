name: Feature request
description: Suggest something Drok should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to get done?
      description: Describe the job, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Drok to do?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
